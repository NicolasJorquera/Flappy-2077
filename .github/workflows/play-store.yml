name: Publicar en Play

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: "Pista de Play"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: "Estado de la versión (draft deja la versión sin publicar en Play Console)"
        type: choice
        options: [completed, inProgress, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: play-store
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.gonisoma.Flappy2077
  AAB: build/Android/Android.aab

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: play-store
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # versionName: bundleVersion de ProjectSettings (un tag v* tiene que coincidir con él).
      # versionCode: número de ejecución + desplazamiento, siempre creciente y por encima de los
      # subidos a mano (el 4 fue la 1.1.0).
      - name: Versión, pista y estado
        id: version
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET || '100' }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_STATUS: ${{ inputs.status }}
        run: |
          name="$(grep -E '^  bundleVersion:' ProjectSettings/ProjectSettings.asset | awk '{print $2}')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$name" ]]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con bundleVersion: $name de ProjectSettings."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            track="$INPUT_TRACK"; status="$INPUT_STATUS"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            track="production"; status="inProgress"
          else
            track="internal"; status="completed"
          fi
          code=$(( GITHUB_RUN_NUMBER + OFFSET ))
          {
            echo "name=$name"
            echo "code=$code"
            echo "track=$track"
            echo "status=$status"
          } >> "$GITHUB_OUTPUT"
          echo "Flappy 2077 $name ($code) → $track, $status"

      # La imagen de Unity con Android ocupa más de lo que deja libre el runner.
      - name: Liberar disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: library-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: library-android-

      # Licencia Personal de Unity: UNITY_LICENSE es el contenido del .ulf (ver README).
      - name: Compilar .aab
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: auto
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: androidAppBundle
          androidTargetSdkVersion: AndroidApiLevel36
          androidKeystoreName: upload.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_PASSWORD }}
          chownFilesTo: "1001:1001"

      # Corta antes de subir si el .aab no es el esperado: firma de depuración, paquete
      # distinto, target < 36 o librerías nativas sin alinear a 16 KB.
      - name: Verificar .aab
        id: verify
        run: |
          set -euo pipefail
          jarsigner -verify "$AAB" | grep -q "jar verified"
          if keytool -printcert -jarfile "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::El .aab está firmado con la clave de depuración."
            exit 1
          fi
          bt="$RUNNER_TEMP/bundletool.jar"
          curl -sSL -o "$bt" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          manifest="$(java -jar "$bt" dump manifest --bundle "$AAB")"
          grep -q "package=\"$PACKAGE_NAME\"" <<<"$manifest" || { echo "::error::El paquete no es $PACKAGE_NAME."; exit 1; }
          grep -q 'android:targetSdkVersion="36"' <<<"$manifest" || { echo "::error::targetSdkVersion no es 36."; exit 1; }
          libs="$RUNNER_TEMP/libs"
          unzip -q -o "$AAB" 'base/lib/*' -d "$libs"
          bad=0
          # El requisito de 16 KB aplica a las ABIs de 64 bits (armeabi-v7a queda fuera).
          for so in $(find "$libs" -path '*arm64-v8a*' -name '*.so' -o -path '*x86_64*' -name '*.so'); do
            for align in $(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}'); do
              if (( align < 0x4000 )); then echo "::error::$(basename "$so") alineada a $align (< 16 KB)"; bad=1; fi
            done
          done
          (( bad == 0 )) || exit 1
          mapping="build/Android/Android_mapping.txt"
          if [[ -f "$mapping" ]]; then echo "mapping=$mapping" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flappy2077-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: build/Android/
          retention-days: 90

      - name: Subir a Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.AAB }}
          mappingFile: ${{ steps.verify.outputs.mapping }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          tracks: ${{ steps.version.outputs.track }}
          status: ${{ steps.version.outputs.status }}
          userFraction: ${{ steps.version.outputs.status == 'inProgress' && '0.2' || '' }}
